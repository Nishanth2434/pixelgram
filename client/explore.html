<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore - PixelGram</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">PixelGram</a>
      <div class="nav-links">
        <a href="index.html" class="nav-icon" title="Home">🏠</a>
        <a href="explore.html" class="nav-icon" title="Explore" style="color: var(--primary-color)">🧭</a>
        <a id="nav-profile-link" href="#" class="nav-icon" title="Profile">👤</a>
        <button id="logout-btn" class="nav-icon" title="Logout">🚪</button>
      </div>
    </div>
  </nav>

  <main class="main-container" style="max-width: 975px; flex-direction: column;">
    <div class="grid-container" id="explore-grid"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/components.js"></script>
  <script>
    window.addEventListener('userLoaded', async () => {
      const grid = document.getElementById('explore-grid');
      
      try {
        const res = await window.api.getExplore();
        grid.innerHTML = res.data.map(post => {
          const mediaUrl = post.mediaUrl.startsWith('http') ? post.mediaUrl : `${window.components.API_BASE}${post.mediaUrl}`;
          const isVideo = post.mediaType === 'video';
          const mediaHtml = isVideo 
            ? `<video src="${mediaUrl}" class="grid-video" loop muted playsinline style="width:100%; height:100%; object-fit:cover; pointer-events:none;"></video>`
            : `<img src="${mediaUrl}" alt="Post image">`;
          const videoIcon = isVideo ? `<div style="position:absolute; top:8px; right:8px; font-size:1.2rem; color:white; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); z-index: 5;">▶️</div>` : '';

          return `
          <div class="grid-item" onclick="window.location.href='post.html?id=${post._id}'">
            ${mediaHtml}
            ${videoIcon}
            <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); opacity: 0; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold; gap: 15px; transition: opacity 0.2s; z-index: 10;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0">
              <span>❤️ ${post.likes.length}</span>
              <span>💬 ${post.commentsCount}</span>
            </div>
          </div>
          `;
        }).join('');

        // Observe videos for autoplay
        if (window.components && window.components.videoObserver) {
          document.querySelectorAll('.grid-video').forEach(v => window.components.videoObserver.observe(v));
        }
      } catch (err) {
        console.error(err);
      }
    });
  </script>
</body>
</html>
