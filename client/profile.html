<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - PixelGram</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="logo">PixelGram</a>
      <div class="nav-links">
        <a href="index.html" class="nav-icon" title="Home">🏠</a>
        <a href="explore.html" class="nav-icon" title="Explore">🧭</a>
        <a id="nav-profile-link" href="#" class="nav-icon" title="Profile" style="color: var(--primary-color)">👤</a>
        <button id="logout-btn" class="nav-icon" title="Logout">🚪</button>
      </div>
    </div>
  </nav>

  <main class="main-container" style="flex-direction: column; max-width: 935px;">
    <header class="profile-header">
      <div class="profile-avatar-container">
        <img src="" alt="Profile picture" class="avatar avatar-large" id="profile-avatar">
      </div>
      <section class="profile-info">
        <div class="profile-title">
          <h2 class="profile-username" id="profile-username"></h2>
          <div id="profile-actions"></div>
        </div>
        <ul class="profile-stats">
          <li><span id="stat-posts">0</span> posts</li>
          <li style="cursor: pointer;" id="btn-followers"><span id="stat-followers">0</span> followers</li>
          <li style="cursor: pointer;" id="btn-following"><span id="stat-following">0</span> following</li>
        </ul>
        <div class="profile-bio">
          <div class="fullname" id="profile-fullname"></div>
          <div id="profile-bio-text"></div>
        </div>
      </section>
    </header>

    <div class="profile-tabs">
      <div class="profile-tab active">POSTS</div>
    </div>

    <div class="grid-container" id="profile-grid"></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/components.js"></script>
  <script>
    window.addEventListener('userLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const username = urlParams.get('username') || (currentUser ? currentUser.username : null);
      
      if (!username) {
        window.location.href = 'login.html';
        return;
      }
      
      try {
        const userRes = await window.api.getUserProfile(username);
        const user = userRes.data;
        
        document.title = `${user.fullName} (@${user.username}) - PixelGram`;
        document.getElementById('profile-avatar').src = `${window.components.API_BASE}${user.avatarUrl}`;
        document.getElementById('profile-username').textContent = user.username;
        document.getElementById('profile-fullname').textContent = user.fullName;
        document.getElementById('profile-bio-text').textContent = user.bio;
        
        document.getElementById('stat-followers').textContent = user.followers.length;
        document.getElementById('stat-following').textContent = user.following.length;

        const actionsDiv = document.getElementById('profile-actions');
        if (currentUser && currentUser.username === user.username) {
          actionsDiv.innerHTML = `<button class="btn-secondary" onclick="window.location.href='edit-profile.html'">Edit Profile</button>`;
        } else {
          const isFollowing = currentUser ? currentUser.following.includes(user._id) : false;
          if (isFollowing) {
            actionsDiv.innerHTML = `<button class="btn-secondary" id="unfollow-btn">Following</button>`;
            document.getElementById('unfollow-btn').addEventListener('click', async () => {
              if (!currentUser) return window.location.href = 'login.html';
              await window.api.unfollowUser(user._id);
              window.location.reload();
            });
          } else {
            actionsDiv.innerHTML = `<button class="btn-primary" id="follow-btn">Follow</button>`;
            document.getElementById('follow-btn').addEventListener('click', async () => {
              if (!currentUser) return window.location.href = 'login.html';
              await window.api.followUser(user._id);
              window.location.reload();
            });
          }
        }

        // Modals
        document.getElementById('btn-followers').addEventListener('click', () => {
          window.components.openModal('Followers', user.followers);
        });
        document.getElementById('btn-following').addEventListener('click', () => {
          window.components.openModal('Following', user.following);
        });

        // Load posts
        const postsRes = await window.api.getUserPosts(user.username);
        const posts = postsRes.data;
        document.getElementById('stat-posts').textContent = posts.length;
        
        const grid = document.getElementById('profile-grid');
        grid.innerHTML = posts.map(post => `
          <div class="grid-item" onclick="window.location.href='post.html?id=${post._id}'">
            <img src="${window.components.API_BASE}${post.imageUrl}" alt="Post image">
            <div style="position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); opacity: 0; display:flex; justify-content:center; align-items:center; color:white; font-weight:bold; gap: 15px; transition: opacity 0.2s;" onmouseover="this.style.opacity=1" onmouseout="this.style.opacity=0">
              <span>❤️ ${post.likes.length}</span>
              <span>💬 ${post.commentsCount}</span>
            </div>
          </div>
        `).join('');

      } catch (err) {
        console.error(err);
        document.querySelector('.main-container').innerHTML = `<h2>User not found</h2>`;
      }
    });
  </script>
</body>
</html>
