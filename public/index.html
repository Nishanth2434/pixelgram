<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelGram</title>
    <link rel="icon" type="image/png" href="/assets/logo.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- App Container -->
    <div id="app-container">
        
        <!-- Auth View -->
        <div id="auth-view" class="view auth-bg">
            <div class="auth-split-container">
                
                <!-- Left Side Banner -->
                <div class="auth-left">
                    <img src="/assets/logo.png" alt="Logo" class="auth-logo-img">
                    <h1>See everyday moments from<br>your <span class="highlight">close friends</span>.</h1>
                    <!-- A placeholder for the collage image -->
                    <img src="https://images.unsplash.com/photo-1611162617474-5b21e879e113?w=800&q=80" alt="Collage" class="auth-left-image">
                </div>

                <!-- Right Side Form -->
                <div class="auth-right">
                    
                    <div id="login-container">
                        <h2 class="auth-right-title">Log into PixelGram</h2>
                        <form id="login-form">
                            <input type="email" id="login-email" placeholder="Mobile number, username or email" required value="demo@pixelgram.com" class="dark-input">
                            <input type="password" id="login-password" placeholder="Password" required value="demo1234" class="dark-input">
                            <button type="submit" class="auth-btn-dark">Log in</button>
                        </form>

                        <div class="forgot-password">Forgot password?</div>
                        <button class="btn-fb"><i class="fa-brands fa-facebook"></i> Log in with Facebook</button>
                    </div>
                    
                    <div id="register-container" style="display: none;">
                        <h2 class="auth-right-title">Sign up for PixelGram</h2>
                        <form id="register-form" style="margin-top: 20px;">
                            <input type="text" id="reg-username" placeholder="Username" required class="dark-input">
                            <input type="email" id="reg-email" placeholder="Email" required class="dark-input">
                            <input type="password" id="reg-password" placeholder="Password" required class="dark-input">
                            <button type="submit" class="auth-btn-dark" style="background-color: #0095f6; color: white;">Sign up</button>
                        </form>
                    </div>

                    <button class="btn-create" id="auth-toggle">Create new account</button>
                    <p id="auth-error" class="error"></p>
                </div>
                
            </div>
        </div>

        <!-- Main App View -->
        <div id="main-view" class="view" style="display: none;">
            <!-- Side Nav (Desktop) / Bottom Nav (Mobile) -->
            <nav class="side-nav">
                <div class="nav-brand">
                    <h1 class="logo desktop-only" style="font-family: 'Brush Script MT', cursive, sans-serif; font-size: 2.2rem;">PixelGram</h1>
                    <i class="fa-brands fa-instagram mobile-only nav-logo-icon"></i>
                </div>
                
                <div class="nav-links">
                    <div class="nav-item active" data-target="feed-page">
                        <i class="fa-solid fa-house"></i>
                        <span class="desktop-only">Home</span>
                    </div>
                    <div class="nav-item desktop-only">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <span>Search</span>
                    </div>
                    <div class="nav-item" data-target="reels-page">
                        <i class="fa-solid fa-video"></i>
                        <span class="desktop-only">Reels</span>
                    </div>
                    <div class="nav-item desktop-only">
                        <i class="fa-regular fa-comment-dots"></i>
                        <span>Messages</span>
                    </div>
                    <div class="nav-item desktop-only">
                        <i class="fa-regular fa-heart"></i>
                        <span>Notifications</span>
                    </div>
                    <div class="nav-item" id="nav-create-post">
                        <i class="fa-regular fa-square-plus"></i>
                        <span class="desktop-only">Create</span>
                    </div>
                    <div class="nav-item" data-target="profile-page">
                        <img src="" alt="profile" class="nav-avatar" id="nav-profile-avatar">
                        <span class="desktop-only">Profile</span>
                    </div>
                </div>
                
                <div class="nav-item more-btn desktop-only" style="margin-top: auto;">
                    <i class="fa-solid fa-bars"></i>
                    <span>More</span>
                </div>
            </nav>

            <!-- Top Nav (Mobile only) -->
            <nav class="mobile-top-nav">
                <h1 class="logo" style="font-family: 'Brush Script MT', cursive, sans-serif;">PixelGram</h1>
                <div class="nav-icons">
                    <i class="fa-regular fa-heart"></i>
                    <i class="fa-regular fa-comment-dots"></i>
                </div>
            </nav>

            <div class="content-area main-content">
                
                <!-- Home Feed -->
                <div id="feed-page" class="page active">
                    <div class="stories-container" id="stories-bar">
                        <!-- Stories injected here -->
                    </div>
                    <div id="posts-container">
                        <!-- Posts injected here -->
                    </div>
                </div>

                <!-- Reels Page -->
                <div id="reels-page" class="page" style="display: none;">
                    <div class="reels-container" id="reels-container">
                        <!-- Reels injected here -->
                    </div>
                </div>

                <!-- Profile Page -->
                <div id="profile-page" class="page" style="display: none;">
                    <div class="profile-header">
                        <img src="" alt="avatar" id="profile-avatar" class="avatar-large">
                        <div class="profile-stats">
                            <h2 id="profile-username">username</h2>
                            <div class="stats-row">
                                <span><strong id="profile-posts-count">0</strong> posts</span>
                                <span><strong id="profile-followers">0</strong> followers</span>
                                <span><strong id="profile-following">0</strong> following</span>
                            </div>
                            <p id="profile-bio" class="bio"></p>
                            <button id="profile-action-btn" class="btn secondary">Edit Profile</button>
                            <button id="logout-btn" class="btn danger" style="margin-top:5px; width: 100%;">Log Out</button>
                        </div>
                    </div>
                    <div class="profile-grid" id="profile-posts-grid">
                        <!-- Profile posts injected here -->
                    </div>
                </div>

            </div>


        </div>
    </div>

    <!-- Modals -->
    <!-- Create Post Modal -->
    <div id="create-modal" class="modal">
        <form id="create-post-form" class="modal-content ig-modal">
            <div class="ig-modal-header">
                <span class="close">&times;</span>
                <h2>Create new post</h2>
                <button type="submit" class="ig-share-btn">Share</button>
            </div>
            <div class="ig-modal-body">
                <input type="url" id="post-image-url" placeholder="Image URL (e.g., https://picsum.photos/600)" required class="ig-input">
                <textarea id="post-caption" placeholder="Write a caption..." class="ig-textarea"></textarea>
            </div>
        </form>
    </div>

    <!-- Story Viewer Modal -->
    <div id="story-modal" class="modal">
        <div class="modal-content story-content">
            <span class="close-story">&times;</span>
            <div class="story-progress"><div class="story-progress-bar"></div></div>
            <div class="story-user-info">
                <img src="" alt="avatar" id="story-avatar" class="avatar-small">
                <span id="story-username">username</span>
            </div>
            <img src="" id="story-image" alt="story">
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
